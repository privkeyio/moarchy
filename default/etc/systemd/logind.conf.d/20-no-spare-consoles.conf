# No login prompt on any console but the session's. logind would otherwise
# start a getty on tty2-tty6 when one is switched to, and a USB keyboard can
# switch to one with Ctrl+Alt+Fn before the lock is up or behind it. A PIN
# typed there is counted like any other (system-auth goes through
# moarchy-pin), but there is no reason to offer one. tty1 is the session's,
# started by its own autologin unit rather than by this.
[Login]
NAutoVTs=0
ReserveVT=0
