# moarchy: no name-resolution responders on the network.
#
# systemd-resolved answers LLMNR (5355) and mDNS (5353) queries on every
# interface by default, which announces the phone's hostname to any network it
# joins. Unicast DNS is unaffected. Debug images keep it off too: they are
# reached over the USB link at 10.66.0.2 (image/configure.sh), not by name.
# Takes effect when systemd-resolved next starts.
[Resolve]
LLMNR=no
MulticastDNS=no
