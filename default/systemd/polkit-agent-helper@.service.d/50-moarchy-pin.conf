# polkit checks a password in this sandboxed unit (ProtectSystem=strict, so
# /var/lib is read-only), and system-auth sends that check to moarchy-pin,
# which has to write its count before it answers. The count's own directory
# and nothing else; `-` so the unit still starts if it is missing, in which
# case moarchy-pin refuses rather than answer uncounted.
[Service]
ReadWritePaths=-/var/lib/moarchy/pin
