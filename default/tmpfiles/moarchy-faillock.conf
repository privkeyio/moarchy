# The lock screen's faillock tally, made for the phone's account every boot.
#
# The lock screen runs PAM as the user, and pam_faillock can only create a
# tally in /run/faillock (root's, 0755) when it runs as root. Unable to create
# one, it counts nothing and never pauses entry. On this phone nothing ever runs
# it as root: tty1 autologin and NOPASSWD sudo authenticate nobody. So without
# this file the ten-tries rule in /etc/pam.d/moarchy-lock is never applied.
#
# `moarchy` is the account image/configure.sh creates. An image built with a
# different MOARCHY_USER needs this line changed to match.
f /run/faillock/moarchy 0660 moarchy root -
