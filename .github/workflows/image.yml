name: image

# Builds the sargo image from this tree and runs verify.sh and the negative test
# on it, on a native arm64 runner (no QEMU). The in-repo packages are built
# here; the manifest components and AUR rebuilds come from the published signed
# [moarchy] repo (scripts/fetch-published.sh), so this tests the tree, not a
# release. The image is not a debug image: no SSH key, no Wi-Fi credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LOG: ${{ github.workspace }}/.cache/build.log

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    # The kernel, when its cache misses, is most of this.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p .cache
          ./scripts/style-check.sh 2>&1 | tee -a "$LOG"
          python3 -I image/boot/test-android-image.py 2>&1 | tee -a "$LOG"
          bash image/boot/test-backends.sh 2>&1 | tee -a "$LOG"

      # Only the kernel is cached, keyed on its recipe and the [device.sargo]
      # pins it reads. Every other in-repo package is rebuilt, since moarchy's
      # payload is bin/, default/ and config/, not its PKGBUILD.
      - name: Kernel cache key
        run: |
          pins=$(sed -n '/^\[device\.sargo\]/,/^\[/p' manifest.toml | sha256sum | cut -c1-16)
          echo "KERNEL_KEY=kernel-$pins-${{ hashFiles('pkgbuilds/linux-moarchy-sdm670/**') }}" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kernel
        with:
          path: .cache/kernel
          key: ${{ env.KERNEL_KEY }}

      - name: Build the in-repo packages
        run: |
          set -o pipefail
          mkdir -p packages .cache/kernel
          cp .cache/kernel/*.pkg.tar.* packages/ 2>/dev/null || true
          # The container builds as its own builder user.
          chmod -R a+rwX packages
          rc=0
          PKGBUILD_ONLY="$(ls pkgbuilds)" ./scripts/provision.sh build 2>&1 | tee -a "$LOG" || rc=$?
          sudo chown -R "$(id -u):$(id -g)" packages
          # Kept even when another package failed, so the next run does not
          # rebuild a kernel that built fine.
          rm -f .cache/kernel/*
          awk '$2 ~ /^linux-moarchy-sdm670-/ { print "packages/" $2 }' packages/.build-manifest |
            xargs -r cp -t .cache/kernel/
          exit $rc

      # Saved now, before anything runs privileged, so nothing an image build
      # executes can change what later runs restore.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.kernel.outputs.cache-hit != 'true' && hashFiles('.cache/kernel/*') != '' }}
        with:
          path: .cache/kernel
          key: ${{ env.KERNEL_KEY }}

      - name: Packages from the published repo
        run: |
          set -o pipefail
          ./scripts/fetch-published.sh packages 2>&1 | tee -a "$LOG"

      - name: Build the image
        run: |
          set -o pipefail
          ./scripts/build-image.sh 2>&1 | tee -a "$LOG"
          sudo chown -R "$(id -u):$(id -g)" images
          art=$(ls -td images/moarchy-sargo-*/ | head -1)
          echo "ART=${art%/}" >> "$GITHUB_ENV"
          df -h /

      - name: Verify the image
        run: |
          set -o pipefail
          ./scripts/verify-image.sh "$ART" 2>&1 | tee -a "$LOG"

      # The plugins' QML unit tests, on the phone's own Qt: Arch Linux ARM's, in
      # the image container. Ubuntu's Qt 6.4 is too old for one of them.
      - name: QML tests
        run: |
          set -o pipefail
          docker run --rm --platform linux/arm64 -v "$PWD:/repo:ro" --entrypoint bash moarchy-image \
            -c 'pacman -Sy --noconfirm --needed qt6-declarative >/dev/null && bash /repo/scripts/test-qml.sh' 2>&1 | tee -a "$LOG"

      - name: Negative test
        run: |
          set -o pipefail
          docker run --rm --privileged --platform linux/arm64 -v "$PWD/images:/img:ro" \
            --entrypoint bash moarchy-image /repo/image/negative-test.sh "/img/$(basename "$ART")" 2>&1 | tee -a "$LOG"

      - name: Checksums
        run: |
          ( cd "$ART" && sha256sum ./* > SHA256SUMS && cat SHA256SUMS )

      # The dev image (MOARCHY_SSH_KEY) with a key made for this run and thrown
      # away with the runner, verified as one, put through its own negative
      # test, and never uploaded. Built outside images/, so nothing that picks
      # the newest artifact there can pick it up.
      - name: Dev image
        run: |
          set -o pipefail
          ssh-keygen -q -t ed25519 -N '' -C ci-throwaway -f "$RUNNER_TEMP/dev"
          MOARCHY_SSH_KEY="$RUNNER_TEMP/dev.pub" OUTDIR="$RUNNER_TEMP/dev-images" \
            ./scripts/build-image.sh 2>&1 | tee -a "$LOG"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/dev-images"
          dev=$(ls -td "$RUNNER_TEMP"/dev-images/moarchy-sargo-*/ | head -1)
          dev=${dev%/}
          DEV_IMAGE=1 ./scripts/verify-image.sh "$dev" 2>&1 | tee -a "$LOG"
          docker run --rm --privileged --platform linux/arm64 -e DEV_IMAGE=1 -v "$(dirname "$dev"):/img:ro" \
            --entrypoint bash moarchy-image /repo/image/negative-test.sh "/img/$(basename "$dev")" 2>&1 | tee -a "$LOG"
          sudo rm -rf "$RUNNER_TEMP/dev-images"

      # Not for a pull request from another repository: an unsigned, flashable
      # image built from someone else's code should not sit here under a
      # neutral name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          name: sargo-image-${{ github.sha }}
          path: ${{ env.ART }}
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-log
          path: .cache/build.log
          retention-days: 7
